name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: portolioappslc
  REGISTRY: portolioappslc-hnh6e7etcyg0h9eu.azurecr.io
  IMAGE: portfolioappslc
  CONTAINER_APP: portfolio-app-slc
  RESOURCE_GROUP: Portfolio-SLC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$REGISTRY/$IMAGE:${{ github.sha }}" -f Dockerfile .

      # Pull request checks stop here. Commits on main also push the image for the deploy job.
      - name: Sign in to Azure
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$REGISTRY/$IMAGE:${{ github.sha }}"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Each deploy is recorded in the repo's Deployments panel.
    environment:
      name: production
      url: https://portfolio-app-slc.gentlehill-e454e29c.westus2.azurecontainerapps.io
    # Deploys run one at a time, in merge order.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:${{ github.sha }}"
