name: Deploy to Azure

# Runs after CI passes on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_NAME: portolioappslc
  REGISTRY: portolioappslc-hnh6e7etcyg0h9eu.azurecr.io
  IMAGE: portfolioappslc
  CONTAINER_APP: portfolio-app-slc
  RESOURCE_GROUP: Portfolio-SLC
  # The commit CI tested (workflow_run), or the current main (by hand).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portfolio-app-slc.gentlehill-e454e29c.westus2.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Build image
        run: docker build -t "$REGISTRY/$IMAGE:$SHA" -f Dockerfile .

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to registry
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$REGISTRY/$IMAGE:$SHA"

      - name: Deploy to Container App
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:$SHA"
